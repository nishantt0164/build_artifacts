name: Upload Frontend ZIP Artifacts to S3

on:
  push:
    branches:
      - lumax
    paths:
      - "project_1/frontend/*.zip"

jobs:
  upload-to-s3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Variables
        run: |
          TIMESTAMP=$(date +'%d-%m-%Y_%H:%M:%S')
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "S3_BUCKET=buildartifacts-demo-fapl" >> $GITHUB_ENV
          echo "FRONTEND_PATH=project_1/frontend" >> $GITHUB_ENV

      - name: Debug File Paths
        run: |
          echo "Checking frontend files:"
          ls -lah $FRONTEND_PATH || echo "No frontend directory found"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Upload Frontend ZIP Files to S3
        run: |
          echo "Available ZIP files:"
          ls -1t $FRONTEND_PATH/*.zip || echo "No ZIP files found"

          FRONTEND_ZIP=$(ls -1t $FRONTEND_PATH/lumax-frontend-*.zip 2>/dev/null | head -n 1)

          if [ -z "$FRONTEND_ZIP" ]; then
            echo "No new Lumax frontend ZIP file found. Skipping..."
          else
            S3_FRONTEND_PATH="s3://$S3_BUCKET/frontend"
            ZIP_BASENAME=$(basename "$FRONTEND_ZIP")

            echo "Uploading $FRONTEND_ZIP to $S3_FRONTEND_PATH"
            aws s3 cp "$FRONTEND_ZIP" "$S3_FRONTEND_PATH/$ZIP_BASENAME"

            echo "Tagging latest.zip to point to $ZIP_BASENAME"
            aws s3 cp "$S3_FRONTEND_PATH/$ZIP_BASENAME" "$S3_FRONTEND_PATH/latest.zip"
          fi
